name: Verified Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in CMake and resources
        required: true
        default: '0.16.0'
      publish:
        description: Publish verified packages and then update channels
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: shiftwheel-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      UPDATE_PUBLIC_KEY_HEX: ${{ vars.UPDATE_PUBLIC_KEY_HEX }}
      UPDATE_KEY_ID: ${{ vars.UPDATE_KEY_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check committed release versions
        run: |
          python tests/release_config_tests.py
          if ($LASTEXITCODE) { throw 'Release version declarations or defaults are inconsistent.' }
      - name: Validate release configuration
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d{1,5}\.\d{1,5}\.\d{1,5}$') { throw 'Invalid version.' }
          if ($env:UPDATE_PUBLIC_KEY_HEX -notmatch '^[a-fA-F0-9]{144}$' -or $env:UPDATE_KEY_ID -notmatch '^[A-Za-z0-9_-]{1,64}$') { throw 'Configure the real public signing pin and key ID in the release environment.' }
          if ((Get-Content CMakeLists.txt -Raw) -notmatch ('project\(ShiftWheel VERSION '+[regex]::Escape($env:RELEASE_VERSION)+' ')) { throw 'Version must match committed source.' }
          python -m pip install -r tests/requirements.txt
          if ($LASTEXITCODE) { throw 'Test dependencies failed.' }
          python scripts/ci-bootstrap.py
          if ($LASTEXITCODE) { throw 'Verified engine bootstrap failed.' }
          python scripts/build-modules.py --verify-only
          if ($LASTEXITCODE) { throw 'Committed module package verification failed.' }
      - name: Configure, build and test
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DSHIFTWHEEL_UPDATE_PUBLIC_KEY=$env:UPDATE_PUBLIC_KEY_HEX" "-DSHIFTWHEEL_UPDATE_KEY_ID=$env:UPDATE_KEY_ID" "-DSHIFTWHEEL_TEST_PYTHON=$((Get-Command python).Source)"
          if ($LASTEXITCODE) { throw 'Configure failed.' }
          ./scripts/build.ps1
          Copy-Item tools/modules build/Release/modules -Recurse
          $env:TEMP=Join-Path $pwd 'build/test-temp'; $env:TMP=$env:TEMP; [void][IO.Directory]::CreateDirectory($env:TEMP)
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Tests failed; no release will be signed.' }
      - name: Import dedicated signing certificate
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODE_SIGN_PFX_BASE64 -or -not $env:CODE_SIGN_PFX_PASSWORD) { throw 'Code-signing certificate secrets are required.' }
          $pfx=Join-Path $env:RUNNER_TEMP 'ShiftWheel-release.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
            $cert=Import-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString $env:CODE_SIGN_PFX_PASSWORD -AsPlainText -Force) -CertStoreLocation Cert:\CurrentUser\My
            "RELEASE_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          } finally { if(Test-Path -LiteralPath $pfx){Remove-Item -LiteralPath $pfx -Force} }
      - name: Sign application and build packages
        run: |
          ./scripts/sign-windows.ps1 -Path build/Release/ShiftWheel.exe -CertificateThumbprint $env:RELEASE_CERT_THUMBPRINT
          foreach($kind in @('mp4','xlsx','pdf','avif','webp','wav','heic','pptx')) {
            & build/Release/ShiftWheel.exe --render-preview "build/wheel-$kind.png" "sample.$kind"
            if($LASTEXITCODE){throw 'Preview failed.'}
          }
          ./scripts/package.ps1 -Distribution full
          ./scripts/package.ps1 -Distribution core
          ./scripts/build-installer.ps1 -Version $env:RELEASE_VERSION
          ./scripts/build-installer.ps1 -Version $env:RELEASE_VERSION -Distribution core -PayloadDirectory "out/ShiftWheel-$env:RELEASE_VERSION-core"
          ./scripts/sign-windows.ps1 -Path "out/ShiftWheel-$env:RELEASE_VERSION-win-x64-setup.exe" -CertificateThumbprint $env:RELEASE_CERT_THUMBPRINT
          ./scripts/sign-windows.ps1 -Path "out/ShiftWheel-$env:RELEASE_VERSION-core-win-x64-setup.exe" -CertificateThumbprint $env:RELEASE_CERT_THUMBPRINT
          git archive --format=zip --prefix="ShiftWheel-$env:RELEASE_VERSION-source/" -o "out/ShiftWheel-$env:RELEASE_VERSION-source.zip" HEAD
          if($LASTEXITCODE){throw 'Source archive failed.'}
      - name: Sign manifest and verify with native parser
        env:
          UPDATE_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY_PEM }}
        run: |
          ./scripts/make-update-manifest.ps1 -Version $env:RELEASE_VERSION
          Copy-Item updates/stable.txt out/stable.txt
          if (-not $env:UPDATE_SIGNING_KEY_PEM) { throw 'Manifest signing key is required.' }
          $private=Join-Path $env:RUNNER_TEMP 'ShiftWheel-update.pem';$public=Join-Path $env:RUNNER_TEMP 'ShiftWheel-public.txt'
          try {
            [IO.File]::WriteAllText($private,$env:UPDATE_SIGNING_KEY_PEM,[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($public,$env:UPDATE_PUBLIC_KEY_HEX,[Text.UTF8Encoding]::new($false))
            ./scripts/sign-update-manifest.ps1 -Manifest out/stable.txt -PrivateKeyPath $private -PublicKeyHexPath $public -KeyId $env:UPDATE_KEY_ID -Destination out/stable-signed.txt
            & build/Release/signature_tests.exe out/stable-signed.txt $env:UPDATE_PUBLIC_KEY_HEX $env:UPDATE_KEY_ID $env:RELEASE_VERSION
            if($LASTEXITCODE){throw 'Native signature verification failed.'}
          } finally {
            foreach($file in @($private,$public)){if(Test-Path -LiteralPath $file){Remove-Item -LiteralPath $file -Force}}
          }
          python scripts/publish-release.py --version $env:RELEASE_VERSION
          if($LASTEXITCODE){throw 'Package preflight failed.'}
      - name: Save reviewable packages
        uses: actions/upload-artifact@v7
        with:
          name: ShiftWheel-${{ inputs.version }}-verified
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            out/ShiftWheel-${{ inputs.version }}-win-x64-setup.exe
            out/ShiftWheel-${{ inputs.version }}-win-x64-setup.exe.sha256
            out/ShiftWheel-${{ inputs.version }}-win-x64.zip
            out/ShiftWheel-${{ inputs.version }}-win-x64.zip.sha256
            out/ShiftWheel-${{ inputs.version }}-source.zip
            out/ShiftWheel-${{ inputs.version }}-source.zip.sha256
            out/ShiftWheel-${{ inputs.version }}-core-win-x64*
            out/module-assets/*
            out/stable.txt
            out/stable-signed.txt
      - name: Publish packages then channels
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish-release.py --version $env:RELEASE_VERSION --publish
          if($LASTEXITCODE){throw 'Publication failed; inspect the draft/release before retrying.'}
      - name: Remove runner certificate
        if: ${{ always() }}
        run: |
          if($env:RELEASE_CERT_THUMBPRINT -match '^[a-fA-F0-9]{40}$') {
            $cert='Cert:\CurrentUser\My\'+$env:RELEASE_CERT_THUMBPRINT
            if(Test-Path -LiteralPath $cert){Remove-Item -LiteralPath $cert -DeleteKey}
          }
