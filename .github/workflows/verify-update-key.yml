name: Verify update signing key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    environment: release
    steps:
      - name: Verify P-256 key and public pin
        shell: pwsh
        env:
          UPDATE_PUBLIC_KEY_HEX: ${{ vars.UPDATE_PUBLIC_KEY_HEX }}
          UPDATE_KEY_ID: ${{ vars.UPDATE_KEY_ID }}
          UPDATE_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY_PEM }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:UPDATE_PUBLIC_KEY_HEX -notmatch '^[0-9a-fA-F]{144}$' -or $env:UPDATE_KEY_ID -notmatch '^[A-Za-z0-9_-]{1,64}$') { throw 'Missing public pin or key ID.' }
          if(-not $env:UPDATE_SIGNING_KEY_PEM) { throw 'Missing update signing secret.' }
          $blob=[Convert]::FromHexString($env:UPDATE_PUBLIC_KEY_HEX)
          if([Text.Encoding]::ASCII.GetString($blob,0,4) -cne 'ECS1' -or [BitConverter]::ToUInt32($blob,4) -ne 32) { throw 'Invalid P-256 public blob.' }
          $private=[Security.Cryptography.ECDsa]::Create()
          $public=[Security.Cryptography.ECDsa]::Create()
          try {
            $private.ImportFromPem($env:UPDATE_SIGNING_KEY_PEM)
            $env:UPDATE_SIGNING_KEY_PEM=$null
            $parameters=$private.ExportParameters($false)
            if($private.KeySize -ne 256 -or $parameters.Curve.Oid.Value -ne '1.2.840.10045.3.1.7') { throw 'Expected P-256.' }
            [byte[]]$actual=@(0x45,0x43,0x53,0x31,32,0,0,0)+$parameters.Q.X+$parameters.Q.Y
            if([Convert]::ToHexString($actual) -cne [Convert]::ToHexString($blob)) { throw 'Private key does not match the public pin.' }
            $point=[Security.Cryptography.ECPoint]::new()
            $point.X=[byte[]]$blob[8..39];$point.Y=[byte[]]$blob[40..71]
            $parameters=[Security.Cryptography.ECParameters]::new()
            $parameters.Curve=[Security.Cryptography.ECCurve]::CreateFromFriendlyName('nistP256')
            $parameters.Q=$point
            $public.ImportParameters($parameters)
            $data=[Text.Encoding]::UTF8.GetBytes("ShiftWheel key connection check v1`nkey_id=$($env:UPDATE_KEY_ID)`n")
            $algorithm=[Security.Cryptography.HashAlgorithmName]::SHA256
            $format=[Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation
            $signature=$private.SignData($data,$algorithm,$format)
            if($signature.Length -ne 64 -or -not $public.VerifyData($data,$signature,$algorithm,$format)) { throw 'Signature verification failed.' }
            $data[0]=$data[0] -bxor 1
            if($public.VerifyData($data,$signature,$algorithm,$format)) { throw 'Tampered data accepted.' }
            $fingerprint=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($blob)).ToLowerInvariant()
            Write-Output 'PASS: public pin matches private key; P-256/P1363 verification and tamper rejection passed.'
            "Update signing key verified: $($env:UPDATE_KEY_ID). Public SHA256: $fingerprint" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            $env:UPDATE_SIGNING_KEY_PEM=$null
            $private.Dispose();$public.Dispose()
          }
